name: Academy HTTPS scheduler

# Diagnóstico temporário: somente check, sem coleta.

on:
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academy-https-scheduler
  cancel-in-progress: false

jobs:
  scheduler:
    if: github.event_name == 'workflow_dispatch' || vars.ACADEMY_SCHEDULER_ACTIVE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a public repository
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != "false" ]; then
            echo "::error::Use the existing public scheduler repository."
            exit 1
          fi
      - name: Check out the scheduler
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Check HTTPS authentication and protocol only
        env:
          ACADEMY_SCHEDULER_URL: ${{ vars.ACADEMY_SCHEDULER_URL }}
          ACADEMY_SCHEDULER_SECRET: ${{ secrets.ACADEMY_SCHEDULER_SECRET }}
        run: node run.mjs --check
